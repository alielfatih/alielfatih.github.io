<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found</title>
<style>
:root{color-scheme:light dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f6f4ef;color:#26292f}
@media(prefers-color-scheme:dark){body{background:#16191e;color:#dde0e5}}
main{max-width:420px;padding:24px;text-align:center}
h1{font-size:1.4rem;margin:0 0 8px}p{margin:0 0 16px;opacity:.8}
a{display:inline-block;padding:10px 18px;border-radius:14px;background:#3f6fb5;color:#fff;text-decoration:none;font-weight:600}
</style></head><body>
<main id="m"><h1>Page not found</h1><p>This address doesn't exist.</p><a href="/McQuiz/">Open McQuiz</a></main>
<script>
/* Add the exact names of your project repos here. URLs are case-sensitive after the domain. */
const apps=["McQuiz"];
const seg=location.pathname.split("/")[1]||"";
const m=apps.find(a=>a.toLowerCase()===seg.toLowerCase());
if(m&&m!==seg){
  document.getElementById("m").innerHTML="<h1>Redirecting…</h1>";
  location.replace("/"+m+location.pathname.slice(seg.length+1)+location.search+location.hash);
}
</script>
</body></html>
